{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>регистрация — грустная школа экономики</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    body {
      background-color: var(--bg-concrete);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Custom 8-bit Pointer Cursor -->
  <div id="custom-cursor"></div>

  <!-- Film Grain Overlay -->
  <div class="noise-overlay"></div>

  <!-- Win98 Register window centered on concrete -->
  <div class="retro-window-modal active" style="position: relative; top: 0; left: 0; transform: none; width: 100%; max-width: 400px; display: block; opacity: 1; box-shadow: var(--shadow-sticker);">
    <div class="retro-window-header">
      <div class="retro-window-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="white" style="margin-right: 4px;"><path d="M2 3h12v11H2V3zm1 3v7h10V6H3zm1-2h8v1H4V4z"/></svg>
        регистрация нового автора
      </div>
      <a href="{% url 'index' %}" class="retro-window-close" style="text-decoration: none; cursor: none;">x</a>
    </div>
    
    <div class="retro-window-body">
      <h2 style="font-family: var(--font-serif); font-size: 24px; margin-bottom: 20px; text-align: center; text-transform: lowercase;">стать автором</h2>
      
      {% if messages %}
        <div style="background-color: #FFCDD2; border: 1.5px solid #D32F2F; color: #C62828; padding: 10px; margin-bottom: 20px; font-size: 13px; font-family: var(--font-sans); text-transform: lowercase; text-align: center;">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="retro-form-group">
          <label>имя пользователя *</label>
          <input type="text" name="username" class="retro-input" placeholder="логин (виден на сайте)" required>
        </div>
        
        <div class="retro-form-group">
          <label>пароль *</label>
          <input type="password" name="password" class="retro-input" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
          <a href="{% url 'login' %}" style="font-size: 12px; color: #1084D0; text-transform: lowercase; cursor: none;">уже есть аккаунт</a>
          <div style="display: flex; gap: 10px;">
            <a href="{% url 'index' %}" class="win98-btn" style="text-decoration: none; cursor: none; color: black; line-height: 1.4;">отмена</a>
            <button type="submit" class="win98-btn">создать</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="{% static 'js/cursor.js' %}"></script>
</body>
</html>
