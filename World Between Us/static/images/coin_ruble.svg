<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="100%" height="100%">
  <defs>
    <!-- Silver gradients -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#9E9E9E" />
      <stop offset="75%" stop-color="#BDBDBD" />
      <stop offset="100%" stop-color="#757575" />
    </linearGradient>
    <linearGradient id="silverInner" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EEEEEE" />
      <stop offset="50%" stop-color="#BDBDBD" />
      <stop offset="100%" stop-color="#616161" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Outer Rim -->
    <circle cx="25" cy="25" r="22" fill="url(#silver)" stroke="#424242" stroke-width="1"/>
    
    <!-- Inner Circle (Relief Effect) -->
    <circle cx="25" cy="25" r="19.5" fill="url(#silverInner)" stroke="#757575" stroke-width="0.8"/>
    
    <!-- Relief Ribbing Lines around border -->
    <circle cx="25" cy="25" r="20.8" fill="none" stroke="#757575" stroke-width="0.5" stroke-dasharray="1.5,1.5"/>

    <!-- Large Relief "1" -->
    <text x="18" y="32" fill="#F5F5F5" stroke="#424242" stroke-width="0.8" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="21" text-anchor="middle">1</text>
    
    <!-- Ruble Symbol "₽" -->
    <text x="32" y="30" fill="#EEEEEE" stroke="#424242" stroke-width="0.6" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">₽</text>
    
    <!-- Oak Leaf Ornament (Relief) -->
    <path d="M 12,34 C 10,28 14,24 16,21 C 18,24 20,28 17,32 Z" fill="#9E9E9E" opacity="0.6" />
    <path d="M 38,32 C 40,26 36,22 34,19 C 32,22 30,26 33,30 Z" fill="#9E9E9E" opacity="0.6" />

    <!-- Glossy Highlight Curve -->
    <path d="M 7,20 C 11,10 20,6 30,7" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
