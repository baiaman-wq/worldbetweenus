<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Soft dropshadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <!-- Pink gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <linearGradient id="purseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="60%" stop-color="#FFB6C1" />
      <stop offset="100%" stop-color="#FF69B4" />
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Gold Hinge/Clasp Bar -->
    <rect x="35" y="24" width="50" height="8" rx="3" fill="url(#gold)" stroke="#3E2723" stroke-width="1.5"/>
    
    <!-- Clasp Balls -->
    <circle cx="53" cy="20" r="5" fill="url(#gold)" stroke="#3E2723" stroke-width="1.5"/>
    <circle cx="67" cy="20" r="5" fill="url(#gold)" stroke="#3E2723" stroke-width="1.5"/>
    
    <!-- Purse Main Body (Classic kiss-lock coin purse pouch) -->
    <path d="M 40,32 
             C 25,36 12,50 12,70 
             C 12,95 28,105 60,105 
             C 92,105 108,95 108,70 
             C 108,50 95,36 80,32 
             Z" 
          fill="url(#purseGrad)" stroke="#3E2723" stroke-width="2" />
          
    <!-- Kitty Whiskers (Left) -->
    <line x1="24" y1="65" x2="38" y2="67" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="72" x2="36" y2="73" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Kitty Whiskers (Right) -->
    <line x1="82" y1="67" x2="96" y2="65" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
    <line x1="84" y1="73" x2="98" y2="72" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Kitty Eyes -->
    <ellipse cx="45" cy="62" rx="2.5" ry="3.5" fill="#3E2723" />
    <ellipse cx="75" cy="62" rx="2.5" ry="3.5" fill="#3E2723" />
    
    <!-- Yellow Nose -->
    <ellipse cx="60" cy="68" rx="3.5" ry="2.5" fill="#FFEE58" stroke="#3E2723" stroke-width="1.2"/>
    
    <!-- Red Bow (Top Left) -->
    <g transform="translate(24, 34) rotate(-15)">
      <!-- Left loop -->
      <path d="M 12,12 C 0,5 0,20 12,14 Z" fill="url(#bodyGrad)" stroke="#3E2723" stroke-width="1.5" />
      <!-- Right loop -->
      <path d="M 12,12 C 24,5 24,20 12,14 Z" fill="url(#bodyGrad)" stroke="#3E2723" stroke-width="1.5" />
      <!-- Center knot -->
      <circle cx="12" cy="13" r="4.5" fill="#FFEB3B" stroke="#3E2723" stroke-width="1.5" />
    </g>
    
    <!-- White highlights to give glossy finish -->
    <path d="M 22,50 C 18,60 18,72 24,80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
