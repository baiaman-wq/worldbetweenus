<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 19" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro pixel cursor drawn pixel-by-pixel using sharp rectangles -->
  <g fill="#000000">
    <!-- Row 1 -->
    <rect x="0" y="0" width="1" height="1"/>
    <!-- Row 2 -->
    <rect x="0" y="1" width="2" height="1"/>
    <!-- Row 3 -->
    <rect x="0" y="2" width="3" height="1"/>
    <!-- Row 4 -->
    <rect x="0" y="3" width="4" height="1"/>
    <!-- Row 5 -->
    <rect x="0" y="4" width="5" height="1"/>
    <!-- Row 6 -->
    <rect x="0" y="5" width="6" height="1"/>
    <!-- Row 7 -->
    <rect x="0" y="6" width="7" height="1"/>
    <!-- Row 8 -->
    <rect x="0" y="7" width="8" height="1"/>
    <!-- Row 9 -->
    <rect x="0" y="8" width="9" height="1"/>
    <!-- Row 10 -->
    <rect x="0" y="9" width="10" height="1"/>
    <!-- Row 11 -->
    <rect x="0" y="10" width="11" height="1"/>
    <!-- Row 12 -->
    <rect x="0" y="11" width="7" height="1"/>
    <!-- Row 13 -->
    <rect x="0" y="12" width="4" height="1"/>
    <rect x="6" y="12" width="2" height="1"/>
    <!-- Row 14 -->
    <rect x="0" y="13" width="1" height="1"/>
    <rect x="5" y="13" width="2" height="1"/>
    <!-- Row 15 -->
    <rect x="5" y="14" width="2" height="1"/>
    <!-- Row 16 -->
    <rect x="4" y="15" width="2" height="1"/>
    <!-- Row 17 -->
    <rect x="4" y="16" width="2" height="1"/>
    <!-- Row 18 -->
    <rect x="3" y="17" width="2" height="1"/>
    <!-- Row 19 -->
    <rect x="3" y="18" width="2" height="1"/>
  </g>
  
  <g fill="#FFFFFF">
    <!-- Row 2 -->
    <rect x="1" y="1" width="1" height="1"/>
    <!-- Row 3 -->
    <rect x="1" y="2" width="2" height="1"/>
    <!-- Row 4 -->
    <rect x="1" y="3" width="3" height="1"/>
    <!-- Row 5 -->
    <rect x="1" y="4" width="4" height="1"/>
    <!-- Row 6 -->
    <rect x="1" y="5" width="5" height="1"/>
    <!-- Row 7 -->
    <rect x="1" y="6" width="6" height="1"/>
    <!-- Row 8 -->
    <rect x="1" y="7" width="7" height="1"/>
    <!-- Row 9 -->
    <rect x="1" y="8" width="8" height="1"/>
    <!-- Row 10 -->
    <rect x="1" y="9" width="9" height="1"/>
    <!-- Row 11 -->
    <rect x="1" y="10" width="5" height="1"/>
    <!-- Row 12 -->
    <rect x="1" y="11" width="4" height="1"/>
    <!-- Row 13 -->
    <rect x="1" y="12" width="3" height="1"/>
    <!-- Row 14 -->
    <rect x="1" y="13" width="2" height="1"/>
    <!-- Row 15 -->
    <rect x="1" y="14" width="1" height="1"/>
    
    <!-- Cursor Stem -->
    <rect x="6" y="11" width="1" height="1" fill="#FFFFFF"/>
    <rect x="5" y="12" width="1" height="1" fill="#FFFFFF"/>
    <rect x="4" y="13" width="1" height="1" fill="#FFFFFF"/>
    <rect x="4" y="14" width="1" height="1" fill="#FFFFFF"/>
    <rect x="3" y="15" width="1" height="1" fill="#FFFFFF"/>
    <rect x="3" y="16" width="1" height="1" fill="#FFFFFF"/>
  </g>
</svg>
